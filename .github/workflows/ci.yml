name: iOS Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT: Mochi.xcodeproj
  SCHEME: Mochi
  BUNDLE_ID: com.zxiang739.mochi

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | /usr/bin/python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          ')
          test -n "$UDID" || { echo "no iPhone simulator"; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # One invocation compiles the app, the widget extension and every test
      # target, then runs them. A separate build step would only repeat this work.
      - name: Build and run all tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -quiet 2>&1 | tee test.log

      - name: Screenshot the running app
        if: always()
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          APP="build/Build/Products/Debug-iphonesimulator/Mochi.app"
          mkdir -p screenshots
          xcrun simctl boot "$UDID" 2>/dev/null || true
          [ -d "$APP" ] || { echo "no app bundle"; exit 0; }
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID" || true
          sleep 8
          xcrun simctl io "$UDID" screenshot screenshots/home-light.png || true
          xcrun simctl ui "$UDID" appearance dark || true
          sleep 3
          xcrun simctl io "$UDID" screenshot screenshots/home-dark.png || true

      - name: Package
        if: always()
        run: |
          mkdir -p artifacts
          APP="build/Build/Products/Debug-iphonesimulator/Mochi.app"
          [ -d "$APP" ] && ditto -c -k --sequesterRsrc --keepParent "$APP" artifacts/Mochi-simulator.zip
          cp test.log artifacts/ 2>/dev/null || true
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mochi-simulator-build
          path: |
            artifacts/
            screenshots/
            build/Tests.xcresult
          if-no-files-found: warn
          retention-days: 30
