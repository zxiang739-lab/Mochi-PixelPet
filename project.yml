name: Mochi

options:
  bundleIdPrefix: com.zxiang739
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  xcodeVersion: "26.0"

fileGroups:
  - README.md
  - Docs

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:

  # ---------------------------------------------------------------- 主 App
  Mochi:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Core
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zxiang739.mochi
        PRODUCT_NAME: Mochi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Mochi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        CFBundleURLTypes:
          - CFBundleURLName: com.zxiang739.mochi
            CFBundleURLSchemes:
              - mochi
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: Copyright © 2026. All rights reserved.
    entitlements:
      path: Sources/App/Mochi.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zxiang739.mochi.shared
    dependencies:
      - target: MochiWidgets
        embed: true

  # ------------------------------------------------- WidgetKit + Live Activity
  MochiWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widgets
      - path: Sources/Core
      - path: Resources
        buildPhase: resources
        excludes:
          - "Assets.xcassets/AppIcon.appiconset"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zxiang739.mochi.widgets
        PRODUCT_NAME: MochiWidgets
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Sources/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Mochi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Sources/Widgets/MochiWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zxiang739.mochi.shared

  # ------------------------------------------------------------ 单元测试
  MochiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MochiCoreTests
      - path: Sources/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zxiang739.mochi.tests
        GENERATE_INFOPLIST_FILE: YES

  # ---------------------------------------------------------------- UI 测试
  MochiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/MochiUITests
    dependencies:
      - target: Mochi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zxiang739.mochi.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Mochi

schemes:
  Mochi:
    build:
      targets:
        Mochi: all
        MochiWidgets: all
    run:
      config: Debug
      commandLineArguments:
        "-MochiUITestMode": false
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: MochiTests
        - name: MochiUITests
      coverageTargets:
        - Mochi
    archive:
      config: Release
